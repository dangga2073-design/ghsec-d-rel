name: ghcr-pkg
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Build and push a tiny OCI image to GHCR
        run: |
          set -e
          mkdir -p /tmp/ctx
          echo "ghsec-d package fixture canary" > /tmp/ctx/canary.txt
          printf 'FROM scratch\nCOPY canary.txt /canary.txt\n' > /tmp/ctx/Dockerfile
          docker build -t ghcr.io/dangga2073-design/ghsec-d-pkg:latest -f /tmp/ctx/Dockerfile /tmp/ctx
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/dangga2073-design/ghsec-d-pkg:latest